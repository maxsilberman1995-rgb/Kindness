<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Happiness Mission</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fffde7 0%, #fff8e1 50%, #ffe0b2 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 20px 16px 0;
      position: sticky;
      top: 0;
      background: linear-gradient(160deg, #fffde7, #fff8e1);
      z-index: 10;
    }

    nav button {
      background: white;
      border: 2px solid #ffe082;
      border-radius: 50px;
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 700;
      color: #a0713a;
      cursor: pointer;
      transition: all 0.15s;
    }

    nav button.active, nav button:hover {
      background: #ffca28;
      border-color: #ffca28;
      color: #4e3400;
    }

    /* ── PAGE WRAPPER ── */
    .page {
      display: none;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .page.active { display: block; }

    /* ── CARD ── */
    .card {
      background: white;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 12px 40px rgba(200, 140, 40, 0.12);
      margin-bottom: 20px;
    }

    .emoji-big {
      font-size: 60px;
      display: block;
      text-align: center;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .label {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f9a825;
      margin-bottom: 10px;
    }

    .badge {
      display: block;
      text-align: center;
      background: #fff9c4;
      color: #f57f17;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      margin: 0 auto 18px;
      width: fit-content;
      border: 1.5px solid #ffe082;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.3;
      margin-bottom: 10px;
      text-align: center;
    }

    .description {
      font-size: 15px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 28px;
      text-align: center;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #ffca28, #ff8f00);
      color: #3e2400;
      border: none;
      border-radius: 50px;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 20px rgba(255, 160, 0, 0.4);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,160,0,0.5); }
    .btn:active { transform: translateY(0); }
    .btn.done {
      background: linear-gradient(135deg, #a5d6a7, #66bb6a);
      color: white;
      box-shadow: 0 6px 20px rgba(102,187,106,0.4);
    }
    .btn:disabled { cursor: default; }

    /* ── STREAK ── */
    .streak {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .streak-fire { font-size: 26px; animation: pulse 1.5s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-count { font-size: 28px; font-weight: 900; color: #ff8f00; line-height: 1; }
    .streak-label { font-size: 11px; color: #aaa; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .date { font-size: 12px; color: #ccc; margin-top: 16px; text-align: center; }

    /* ── HISTORY / ARCHIVE ── */
    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: #4e3400;
      margin-bottom: 20px;
    }

    .history-item {
      background: white;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(200,140,40,0.08);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .history-emoji { font-size: 32px; flex-shrink: 0; }

    .history-body { flex: 1; }

    .history-title { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
    .history-desc { font-size: 13px; color: #888; line-height: 1.5; }
    .history-date { font-size: 11px; color: #bbb; margin-top: 4px; }

    .history-check {
      font-size: 18px;
      flex-shrink: 0;
      align-self: center;
    }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 15px;
      margin-top: 60px;
    }

    /* ── BASEBALL BACKGROUND ── */
    .baseball-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bb {
      position: absolute;
      opacity: 0.6;
      filter: drop-shadow(0 4px 12px rgba(180, 60, 20, 0.25));
    }

    .bb svg { display: block; }

    .bb1  { width: 220px; top: -40px;  left: -30px;  animation: bbdrift 22s ease-in-out infinite; }
    .bb2  { width: 140px; top: 5%;     right: -10px; animation: bbdrift 18s ease-in-out infinite 3s; }
    .bb3  { width: 120px; top: 36%;    left: -10px;  animation: bbdrift 25s ease-in-out infinite 6s; }
    .bb4  { width: 180px; top: 50%;    right: -20px; animation: bbdrift 20s ease-in-out infinite 1s; }
    .bb5  { width: 110px; bottom: 60px; left: 6%;    animation: bbdrift 16s ease-in-out infinite 9s; }
    .bb6  { width: 150px; bottom: -20px; right: 8%;  animation: bbdrift 24s ease-in-out infinite 4s; }
    .bb7  { width: 100px; top: 68%;    left: 40%;    animation: bbdrift 19s ease-in-out infinite 7s; }

    @keyframes bbdrift {
      0%,  100% { transform: translateY(0)    rotate(0deg); }
      33%        { transform: translateY(18px) rotate(12deg); }
      66%        { transform: translateY(-10px) rotate(-8deg); }
    }

    nav, .page { position: relative; z-index: 1; }
    nav { z-index: 10; }

    /* ── CONFETTI ── */
    #confetti-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 999;
    }
  </style>
</head>

    // ── STATE ────────────────────────────────────────────
    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getDayIndex() {
      const today = new Date();
      return Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
    }

    function loadState() {
      const todayKey = getTodayKey();
      return {
        streak: parseInt(localStorage.getItem('happiness_streak') || '0'),
        lastCompleted: localStorage.getItem('happiness_last_completed') || '',
        completedToday: localStorage.getItem('happiness_completed_today') === 'true' &&
                        localStorage.getItem('happiness_today_key') === todayKey,
      };
    }

    function saveCompletion() {
      const today = getTodayKey();
      const last = localStorage.getItem('happiness_last_completed') || '';
      let streak = parseInt(localStorage.getItem('happiness_streak') || '0');

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

      streak = (last === yKey || last === '') ? streak + 1 : (last !== today ? 1 : streak);

      localStorage.setItem('happiness_streak', streak);
      localStorage.setItem('happiness_last_completed', today);
      localStorage.setItem('happiness_completed_today', 'true');
      localStorage.setItem('happiness_today_key', today);

      // Save to history
      const history = JSON.parse(localStorage.getItem('happiness_history') || '[]');
      const mission = MISSIONS[getDayIndex() % MISSIONS.length];
      if (!history.find(h => h.date === today)) {
        history.unshift({ date: today, mission });
        localStorage.setItem('happiness_history', JSON.stringify(history));
      }

      return streak;
    }

    // ── RENDER TODAY ─────────────────────────────────────
    function render() {
      const mission = MISSIONS[getDayIndex() % MISSIONS.length];
      const state = loadState();
      const dayIdx = getDayIndex();
      const today = new Date();

      const history = JSON.parse(localStorage.getItem('happiness_history') || '[]');
      const missionNum = state.completedToday ? history.length : history.length + 1;

      document.getElementById('mission-emoji').textContent = mission.emoji;
      document.getElementById('mission-title').textContent = mission.title;
      document.getElementById('mission-desc').textContent = mission.desc;
      document.getElementById('mission-badge').textContent = `Mission #${missionNum}`;
      document.getElementById('streak-count').textContent = state.streak;
      document.getElementById('today-date').textContent = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      const btn = document.getElementById('accomplish-btn');
      if (state.completedToday) {
        btn.innerHTML = '<span>🌟</span> Completed Today!';
        btn.classList.add('done');
        btn.disabled = true;
      }
    }

    function completeMission() {
      const streak = saveCompletion();
      const btn = document.getElementById('accomplish-btn');
      btn.innerHTML = '<span>🌟</span> Completed Today!';
      btn.classList.add('done');
      btn.disabled = true;
      document.getElementById('streak-count').textContent = streak;
      launchConfetti();
    }

    // ── RENDER MISSIONS HISTORY ───────────────────────────
    function renderMissions() {
      const list = document.getElementById('missions-list');
      const history = JSON.parse(localStorage.getItem('happiness_history') || '[]');

      if (history.length === 0) {
        list.innerHTML = '<div class="empty">No completed missions yet.<br>Complete today\'s mission to start your log!</div>';
        return;
      }

      list.innerHTML = history.map(h => `
        <div class="history-item">
          <div class="history-emoji">${h.mission.emoji}</div>
          <div class="history-body">
            <div class="history-title">${h.mission.title}</div>
            <div class="history-desc">${h.mission.desc}</div>
            <div class="history-date">${formatDate(h.date)}</div>
          </div>
          <div class="history-check">✅</div>
        </div>
      `).join('');
    }

    // ── NAV ───────────────────────────────────────────────
    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      document.getElementById('nav-' + name).classList.add('active');
      if (name === 'missions') renderMissions();
    }

    // ── UTILS ─────────────────────────────────────────────
    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    // ── CONFETTI ──────────────────────────────────────────
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#ffca28','#ff8f00','#66bb6a','#42a5f5','#ab47bc','#ff7043','#26c6da','#ec407a'];
      const pieces = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: Math.random() * 10 + 6, h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.15,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 4 + 2,
        opacity: 1,
      }));
      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;
          if (frame > 120) p.opacity -= 0.012;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 220) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      draw();
    }

    render();
  </script>
