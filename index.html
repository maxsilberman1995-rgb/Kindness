<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Kindness Mission</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #e3f2fd 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 16px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f06292;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .description {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #f06292, #ec407a);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 20px rgba(240, 98, 146, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(240, 98, 146, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background: linear-gradient(135deg, #a5d6a7, #66bb6a);
      box-shadow: 0 6px 20px rgba(102, 187, 106, 0.4);
      cursor: default;
    }

    .btn.done {
      background: linear-gradient(135deg, #a5d6a7, #66bb6a);
      box-shadow: 0 6px 20px rgba(102, 187, 106, 0.4);
    }

    .streak {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .streak-fire {
      font-size: 28px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-info {
      text-align: left;
    }

    .streak-count {
      font-size: 28px;
      font-weight: 900;
      color: #ff7043;
      line-height: 1;
    }

    .streak-label {
      font-size: 12px;
      color: #999;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .date {
      font-size: 12px;
      color: #bbb;
      margin-top: 20px;
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .badge {
      display: inline-block;
      background: #fff9c4;
      color: #f57f17;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 20px;
      border: 1.5px solid #ffe082;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="card">
    <span class="emoji" id="mission-emoji">💛</span>
    <div class="label">Today's Kindness Mission</div>
    <div class="badge" id="mission-badge">Mission #1</div>
    <h1 id="mission-title">Loading…</h1>
    <p class="description" id="mission-desc"></p>
    <button class="btn" id="accomplish-btn" onclick="completeMission()">
      <span>✅</span> Mission Accomplished!
    </button>
    <div class="streak">
      <span class="streak-fire">🔥</span>
      <div class="streak-info">
        <div class="streak-count" id="streak-count">0</div>
        <div class="streak-label">Day Streak</div>
      </div>
    </div>
    <div class="date" id="today-date"></div>
  </div>

  <script>
    const MISSIONS = [
      { emoji: "😊", title: "Smile at a Stranger", desc: "Give a genuine smile to someone you pass today — a neighbor, cashier, or anyone you meet. A smile costs nothing and can make someone's entire day." },
      { emoji: "📝", title: "Leave a Positive Note", desc: "Write a short encouraging note and leave it somewhere someone will find it — on a coworker's desk, a library book, or a public mirror." },
      { emoji: "☕", title: "Buy Someone's Coffee", desc: "Pay for the drink of the person behind you in line, or treat a friend to their favorite beverage just because." },
      { emoji: "📞", title: "Call Someone You Miss", desc: "Reach out to a friend or family member you haven't spoken to in a while. A quick 'I was thinking of you' goes a long way." },
      { emoji: "🌱", title: "Compliment Someone Sincerely", desc: "Give one specific, heartfelt compliment today. Focus on character or effort rather than appearance." },
      { emoji: "🤝", title: "Help Without Being Asked", desc: "Hold a door, carry groceries, or offer to help a colleague with a task — before they have to ask." },
      { emoji: "🌻", title: "Share Something Uplifting", desc: "Send a friend an article, song, meme, or video that made you happy. Spread the joy intentionally." },
      { emoji: "🗑️", title: "Pick Up Litter", desc: "Pick up three pieces of litter you see on your walk today. Small acts of environmental kindness add up." },
      { emoji: "⭐", title: "Write a Positive Review", desc: "Leave a glowing review for a small business, restaurant, or app that you genuinely love. It helps more than you know." },
      { emoji: "👂", title: "Listen Without Interrupting", desc: "In your next conversation, give your full attention. No phone, no planning your response — just truly listen." },
      { emoji: "🍪", title: "Share Food with Someone", desc: "Bring a snack to share with coworkers, neighbors, or friends. Breaking bread is one of the oldest forms of kindness." },
      { emoji: "💌", title: "Send a Gratitude Message", desc: "Text or email someone to tell them one specific thing you appreciate about them. Be genuine and detailed." },
      { emoji: "🎁", title: "Give Away Something Useful", desc: "Find one item you no longer need and donate it, gift it to a friend, or leave it out for a neighbor to take." },
      { emoji: "🧹", title: "Help with a Chore", desc: "Offer to do a chore for someone in your household or community — dishes, laundry, yard work. No strings attached." },
      { emoji: "🌟", title: "Acknowledge Someone's Hard Work", desc: "Find someone who works hard but rarely gets recognized — a janitor, delivery driver, or support staff — and thank them specifically." },
      { emoji: "🐾", title: "Show Love to an Animal", desc: "Pet a dog, volunteer at a shelter, or donate to an animal rescue. Animals deserve kindness too." },
      { emoji: "🤲", title: "Donate to a Cause", desc: "Give even a small amount to a cause you care about. Look up a local charity or community fund that could use support." },
      { emoji: "🚶", title: "Let Someone Go First", desc: "Yield your spot in line, your parking space, or the right of way — with a smile and no resentment." },
      { emoji: "📚", title: "Share Knowledge", desc: "Teach someone a skill, recommend a book, or share a useful tip. Knowledge shared is kindness multiplied." },
      { emoji: "🌈", title: "Celebrate Someone's Win", desc: "Find out if anyone in your life has good news and make a point to celebrate with them, even in a small way." },
      { emoji: "💬", title: "Check In on a Friend", desc: "Send a simple 'How are you really doing?' to a friend who might be going through a tough time." },
      { emoji: "🕯️", title: "Offer Encouragement", desc: "Find someone who is struggling with a goal or challenge and offer genuine words of encouragement today." },
      { emoji: "🧃", title: "Bring Refreshments", desc: "Bring drinks or snacks to a meeting, study session, or gathering. Small gestures of care set a warm tone." },
      { emoji: "🏘️", title: "Introduce Yourself to a Neighbor", desc: "Knock on a neighbor's door you've never spoken to and introduce yourself. Community starts with a hello." },
      { emoji: "🎶", title: "Dedicate a Song", desc: "Send someone a song that made you think of them, with a note explaining why. Music is a love language." },
      { emoji: "🛍️", title: "Support a Local Business", desc: "Choose a local, independent shop or restaurant over a chain today. Your dollars help real people in your community." },
      { emoji: "🌍", title: "Reduce Waste Mindfully", desc: "Make one intentional choice to reduce waste today — bring a reusable bag, skip the straw, or compost." },
      { emoji: "🧡", title: "Forgive Someone", desc: "Let go of a small grudge. Reach out or simply release the resentment internally — for your peace and theirs." },
      { emoji: "🎂", title: "Remember an Important Date", desc: "Check if anyone close to you has an upcoming birthday or anniversary and plan a small acknowledgment." },
      { emoji: "🤗", title: "Offer a Hug", desc: "Ask someone who might need it if they'd like a hug. Physical warmth and connection is a powerful form of kindness." },
    ];

    function getMissionForToday() {
      const today = new Date();
      const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
      return MISSIONS[dayOfYear % MISSIONS.length];
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function loadState() {
      return {
        streak: parseInt(localStorage.getItem('kindness_streak') || '0'),
        lastCompleted: localStorage.getItem('kindness_last_completed') || '',
        completedToday: localStorage.getItem('kindness_completed_today') === 'true' &&
                        localStorage.getItem('kindness_today_key') === getTodayKey(),
      };
    }

    function saveCompletion() {
      const today = getTodayKey();
      const last = localStorage.getItem('kindness_last_completed') || '';
      let streak = parseInt(localStorage.getItem('kindness_streak') || '0');

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

      if (last === yesterdayKey || last === '') {
        streak += 1;
      } else if (last !== today) {
        streak = 1;
      }

      localStorage.setItem('kindness_streak', streak);
      localStorage.setItem('kindness_last_completed', today);
      localStorage.setItem('kindness_completed_today', 'true');
      localStorage.setItem('kindness_today_key', today);
      return streak;
    }

    function render() {
      const mission = getMissionForToday();
      const state = loadState();
      const today = new Date();
      const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);

      document.getElementById('mission-emoji').textContent = mission.emoji;
      document.getElementById('mission-title').textContent = mission.title;
      document.getElementById('mission-desc').textContent = mission.desc;
      document.getElementById('mission-badge').textContent = `Mission #${(dayOfYear % MISSIONS.length) + 1}`;
      document.getElementById('streak-count').textContent = state.streak;
      document.getElementById('today-date').textContent = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      const btn = document.getElementById('accomplish-btn');
      if (state.completedToday) {
        btn.innerHTML = '<span>🌟</span> Completed Today!';
        btn.classList.add('done');
        btn.disabled = true;
      }
    }

    function completeMission() {
      const streak = saveCompletion();
      const btn = document.getElementById('accomplish-btn');
      btn.innerHTML = '<span>🌟</span> Completed Today!';
      btn.classList.add('done');
      btn.disabled = true;
      document.getElementById('streak-count').textContent = streak;
      launchConfetti();
    }

    // ---- Confetti engine ----
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#f06292','#ec407a','#66bb6a','#ffca28','#42a5f5','#ab47bc','#ff7043','#26c6da'];
      const pieces = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.15,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 4 + 2,
        opacity: 1,
      }));

      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotSpeed;
          if (frame > 120) p.opacity -= 0.012;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 220) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      draw();
    }

    render();
  </script>
</body>
</html>
